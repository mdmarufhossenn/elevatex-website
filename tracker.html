<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AC Tech Job Tracker</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    overscroll-behavior: none;
  }

  /* ── Layout ── */
  #app {
    min-height: 100dvh;
    max-width: 448px;
    margin: 0 auto;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,.15);
  }

  /* ── Header ── */
  header {
    background: #0f172a;
    color: white;
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -.5px; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .btn-icon {
    background: #1e293b;
    border: none;
    color: #cbd5e1;
    padding: 10px;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-icon:active { background: #334155; }
  .btn-icon.blue { background: #3b82f6; color: white; }
  .btn-icon.blue:active { background: #2563eb; transform: scale(.94); }
  .btn-back { background: none; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 50%; transition: background .15s; margin-left: -8px; }
  .btn-back:active { background: #1e293b; }

  /* ── Main ── */
  main { flex: 1; padding: 12px 12px 96px; overflow-y: auto; }

  /* ── Empty State ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding-top: 120px; text-align: center;
    animation: fadeUp .4s ease;
  }
  .empty-icon { background: #e2e8f0; padding: 24px; border-radius: 48px; margin-bottom: 24px; box-shadow: inset 0 2px 8px rgba(0,0,0,.1); }
  .empty-state h2 { font-size: 2rem; font-weight: 900; color: #1e293b; margin-bottom: 8px; }
  .empty-state p { font-size: 1.3rem; font-weight: 700; color: #64748b; }

  /* ── Section Title ── */
  .section-title {
    font-size: 1.2rem; font-weight: 900; color: #1e293b;
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    padding-left: 4px;
  }

  /* ── Job Card ── */
  .jobs-list { display: flex; flex-direction: column; gap: 20px; }
  .job-group { display: flex; flex-direction: column; gap: 16px; }

  .card-wrapper {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  .swipe-bg {
    position: absolute; inset: 0; display: flex; z-index: 0;
  }
  .swipe-done {
    width: 50%; background: #22c55e; display: flex;
    align-items: center; padding-left: 28px;
    color: white; font-weight: 900; font-size: 1.1rem; gap: 8px;
  }
  .swipe-pay {
    width: 50%; background: #3b82f6; display: flex;
    align-items: center; justify-content: flex-end; padding-right: 28px;
    color: white; font-weight: 900; font-size: 1.1rem; gap: 8px;
    margin-left: auto;
  }

  .job-card {
    position: relative; z-index: 1; background: white;
    border-radius: 28px;
    border: 3px solid transparent;
    transition: border-color .2s, box-shadow .2s;
    cursor: pointer;
    user-select: none;
    touch-action: pan-y;
    will-change: transform;
  }
  .job-card.priority { border-color: #1e293b; }
  .job-card.late { border-color: #ef4444; box-shadow: 0 0 0 rgba(239,68,68,0); animation: pulseShadow 1.2s infinite; }

  @keyframes pulseShadow {
    0%   { box-shadow: 0 0 0px rgba(239,68,68,0); }
    50%  { box-shadow: 0 0 24px rgba(239,68,68,.7); }
    100% { box-shadow: 0 0 0px rgba(239,68,68,0); }
  }

  /* Banner */
  .card-banner {
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 900; font-size: 1rem; letter-spacing: .3px;
    border-radius: 24px 24px 0 0;
  }
  .banner-late    { background: #dc2626; color: white; animation: blink 1.1s infinite; }
  .banner-payment { background: #2563eb; color: white; }
  .banner-upcoming { background: #facc15; color: #713f12; }
  .banner-gonow   { background: #facc15; color: #713f12; }
  .banner-callback { background: #1e293b; color: white; }

  @keyframes blink { 50% { opacity: .75; } }

  .banner-amount {
    background: rgba(0,0,0,.2); padding: 2px 12px;
    border-radius: 12px; font-size: 1.1rem;
  }

  /* Card body */
  .card-body { padding: 16px 20px 20px; }

  .time-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 12px;
    font-weight: 900; font-size: 1.1rem; border: 1.5px solid;
    margin-bottom: 14px;
  }
  .time-badge.normal { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }
  .time-badge.upcoming { background: #fef9c3; color: #713f12; border-color: #fde047; }
  .time-secondary { font-size: 1rem; font-weight: 700; margin-left: 6px; }
  .time-secondary.upcoming { color: #854d0e; }
  .time-secondary.normal { color: #94a3b8; }

  .phone-link {
    display: block; text-decoration: none;
    background: #f8fafc; border: 2px solid #e2e8f0;
    border-radius: 22px; padding: 14px 18px;
    display: flex; align-items: center; gap: 18px;
    transition: background .15s;
    margin-bottom: 14px;
  }
  .phone-link:active { background: #e2e8f0; }
  .phone-icon { background: #22c55e; border-radius: 14px; padding: 12px; box-shadow: 0 4px 12px rgba(34,197,94,.35); flex-shrink: 0; display: flex; }
  .phone-num { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #1e293b; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: .9rem; font-weight: 700; padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 4px; border: 1px solid; }
  .tag-area { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .tag-problem { background: #fffbeb; color: #78350f; border-color: #fde68a; }
  .card-note { background: #f8fafc; border: 1px solid #f1f5f9; padding: 10px 14px; border-radius: 14px; font-size: 1rem; font-weight: 700; color: #475569; margin-top: 8px; }

  /* ── More button on card ── */
  .card-more { position: absolute; top: 10px; right: 14px; background: rgba(0,0,0,.15); border: none; border-radius: 50%; padding: 4px; cursor: pointer; color: white; display: flex; z-index: 2; }
  .card-more:active { background: rgba(0,0,0,.35); }

  /* ── Add Job Form ── */
  .add-form { display: flex; flex-direction: column; gap: 22px; padding: 8px 0 80px; animation: slideIn .25s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

  .form-label { font-size: 1.3rem; font-weight: 900; color: #1e293b; margin-bottom: 10px; display: block; }

  .phone-row { display: flex; gap: 10px; }
  .input-phone {
    flex: 1; background: white; border: 3px solid #60a5fa;
    border-radius: 28px; padding: 18px 16px;
    font-size: 2rem; font-weight: 900; text-align: center;
    letter-spacing: 3px; color: #1e293b; outline: none;
    transition: border-color .2s; min-width: 0;
  }
  .input-phone:focus { border-color: #2563eb; }
  .btn-paste {
    background: #1e293b; color: white; border: none; border-radius: 22px;
    padding: 14px 18px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    font-weight: 700; font-size: .8rem; min-width: 76px;
    transition: transform .15s;
  }
  .btn-paste:active { transform: scale(.93); }

  .form-card { background: white; border-radius: 28px; border: 2px solid #e2e8f0; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 20px; border-radius: 18px; font-weight: 900; font-size: 1.1rem;
    border: 2px solid #e2e8f0; background: #f8fafc; color: #475569;
    cursor: pointer; transition: transform .1s, background .15s; user-select: none;
  }
  .chip:active { transform: scale(.93); }
  .chip.sel-dark { background: #1e293b; color: white; border-color: #1e293b; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .chip.sel-blue { background: #dbeafe; color: #1e40af; border-color: #93c5fd; box-shadow: 0 1px 4px rgba(59,130,246,.2); }
  .chip.sel-amber { background: #fef3c7; color: #78350f; border-color: #fcd34d; }

  input[type=time] {
    margin-top: 14px; width: 100%; background: #f1f5f9; border: 2px solid #cbd5e1;
    border-radius: 18px; padding: 18px; font-size: 1.6rem; font-weight: 900; outline: none; color: #1e293b;
  }
  input[type=text], .input-note {
    width: 100%; background: #f1f5f9; border: 2px solid #e2e8f0;
    border-radius: 18px; padding: 14px 18px; font-size: 1.1rem; font-weight: 700;
    outline: none; color: #1e293b; margin-top: 14px;
  }
  input[type=text]:focus, .input-note:focus { border-color: #60a5fa; }
  .input-area {
    width: 100%; background: white; border: 3px solid #cbd5e1;
    border-radius: 28px; padding: 20px; font-size: 1.5rem; font-weight: 900;
    outline: none; color: #1e293b; margin-top: 10px;
  }
  .input-area:focus { border-color: #3b82f6; }

  .btn-save {
    width: 100%; background: #2563eb; color: white; border: none;
    border-radius: 26px; padding: 24px; font-size: 2rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 8px 24px rgba(37,99,235,.4);
    transition: transform .15s, background .15s;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 24px;
  }
  .btn-save:active { transform: scale(.95); background: #1d4ed8; }

  /* ── Overlays ── */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,23,42,.9);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .overlay-sheet {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,23,42,.6);
    display: flex; flex-direction: column; justify-content: flex-end;
    backdrop-filter: blur(4px);
    animation: fadeIn .2s ease;
  }

  /* Call Prompt */
  .call-box {
    background: white; border-radius: 36px; padding: 32px;
    width: 100%; max-width: 360px;
    border: 4px solid #22c55e;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: popIn .25s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  .call-icon-bg { background: #dcfce7; border-radius: 50%; padding: 20px; margin-bottom: 16px; }
  .call-box h2 { font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
  .call-box p { font-size: 1.4rem; font-weight: 700; color: #64748b; margin-bottom: 32px; }
  .btn-call {
    width: 100%; background: #22c55e; color: white; border: none; border-radius: 24px;
    padding: 22px; font-size: 1.6rem; font-weight: 900; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-bottom: 14px; box-shadow: 0 8px 20px rgba(34,197,94,.4);
    transition: transform .15s;
  }
  .btn-call:active { transform: scale(.95); background: #16a34a; }
  .btn-skip {
    width: 100%; background: #f1f5f9; color: #475569; border: none; border-radius: 18px;
    padding: 18px; font-size: 1.4rem; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  .btn-skip:active { background: #e2e8f0; }

  /* Payment Sheet */
  .sheet-box {
    background: white; border-radius: 40px 40px 0 0; padding: 24px 24px 48px;
    width: 100%; box-shadow: 0 -20px 50px rgba(0,0,0,.5);
    animation: slideUp .3s cubic-bezier(.25,.46,.45,.94);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 64px; height: 6px; background: #e2e8f0; border-radius: 3px; margin: 0 auto 24px; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 8px; }
  .sheet-title { font-size: 1.6rem; font-weight: 900; color: #1e293b; display: flex; align-items: center; gap: 8px; }
  .btn-close { background: #e2e8f0; border: none; border-radius: 50%; padding: 8px; cursor: pointer; display: flex; transition: background .15s; }
  .btn-close:active { background: #cbd5e1; }

  .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  .preset-btn {
    background: #eff6ff; color: #1d4ed8; border: 3px solid #bfdbfe;
    border-radius: 22px; padding: 18px 8px; font-size: 1.3rem; font-weight: 900;
    cursor: pointer; transition: background .15s;
  }
  .preset-btn:active { background: #bfdbfe; }

  .amount-row {
    display: flex; align-items: center; gap: 12px;
    background: #f1f5f9; border-radius: 18px; padding: 16px;
    border: 3px solid #e2e8f0; margin-bottom: 28px;
  }
  .taka-sign { font-size: 2rem; font-weight: 900; color: #94a3b8; }
  #payment-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-size: 2.8rem; font-weight: 900; color: #1e293b;
  }
  #payment-input::placeholder { color: #cbd5e1; }

  .btn-save-pay {
    width: 100%; background: #2563eb; color: white; border: none;
    border-radius: 24px; padding: 22px; font-size: 1.6rem; font-weight: 900;
    cursor: pointer; transition: transform .15s, background .15s;
    box-shadow: 0 6px 20px rgba(37,99,235,.4);
  }
  .btn-save-pay:active { transform: scale(.95); }
  .btn-save-pay:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; opacity: .5; }

  /* Action Sheet */
  .action-sheet-phone { font-size: 1.4rem; font-weight: 900; color: #1e293b; text-align: center; margin-bottom: 24px; }
  .action-btn {
    width: 100%; border: none; border-radius: 18px; padding: 20px;
    font-size: 1.3rem; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
    text-decoration: none; transition: background .15s;
  }
  .action-btn:active { filter: brightness(.92); }
  .action-call { background: #f1f5f9; color: #1e293b; }
  .action-gonow { background: #fef9c3; color: #713f12; border: 1px solid #fde047; }
  .action-payment-due { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
  .action-done { background: #22c55e; color: white; border-radius: 18px; padding: 22px; font-size: 1.6rem; box-shadow: 0 6px 20px rgba(34,197,94,.4); margin-top: 16px; }

  /* Success Animations */
  .anim-overlay {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.5); backdrop-filter: blur(4px);
    animation: fadeIn .2s ease;
  }
  .anim-done-circle {
    background: #22c55e; padding: 32px; border-radius: 50%;
    box-shadow: 0 0 100px rgba(34,197,94,.8);
    animation: popIn .3s cubic-bezier(.175,.885,.32,1.275);
  }
  .anim-paid {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    animation: fadeUp .3s ease;
  }
  .anim-paid-emoji {
    font-size: 4.5rem; background: #facc15; padding: 32px; border-radius: 50%;
    box-shadow: 0 0 100px rgba(250,204,21,1); animation: bounce .6s infinite alternate;
  }
  @keyframes bounce { to { transform: translateY(-16px); } }
  .anim-paid-text { font-size: 3rem; font-weight: 900; color: #16a34a; filter: drop-shadow(0 2px 8px rgba(0,0,0,.2)); }

  /* Snackbar */
  #snackbar {
    position: fixed; bottom: 24px; left: 16px; right: 16px; z-index: 90;
    background: #1e293b; color: white; padding: 16px 20px;
    border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 900; font-size: 1.1rem; border: 2px solid #334155;
    animation: fadeUp .25s ease;
    max-width: 448px; margin-left: auto; margin-right: auto;
  }
  #snackbar.hidden { display: none; }
  .btn-undo {
    background: #334155; border: none; color: white; padding: 8px 16px;
    border-radius: 12px; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-size: 1rem;
  }
  .btn-undo:active { background: #475569; }

  /* History */
  .history-summary {
    background: #e2e8f0; border: 2px solid #cbd5e1; border-radius: 24px;
    padding: 18px 20px; font-weight: 900; color: #334155; font-size: 1.1rem;
    display: flex; justify-content: space-between; margin-bottom: 22px;
  }
  .history-amount { color: #15803d; }
  .history-group-label { font-size: 1.1rem; font-weight: 900; color: #94a3b8; margin: 0 0 12px 8px; }
  .history-card {
    background: white; padding: 18px 20px; border-radius: 24px;
    border: 2px solid #f1f5f9; display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 14px;
  }
  .history-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .history-phone { font-weight: 900; font-size: 1.3rem; letter-spacing: 2px; color: #1e293b; }
  .history-area { color: #64748b; font-weight: 700; font-size: 1rem; }
  .status-badge { font-weight: 900; font-size: .9rem; padding: 4px 10px; border-radius: 8px; }
  .status-done { background: #dcfce7; color: #166534; }
  .status-paid { background: #dbeafe; color: #1e40af; }
  .history-time { color: #94a3b8; font-weight: 700; font-size: .85rem; margin-top: 4px; }
  .btn-reopen {
    background: #f8fafc; color: #334155; border: 2px solid #e2e8f0; border-radius: 14px;
    padding: 12px; font-weight: 900; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s; width: 100%;
  }
  .btn-reopen:active { background: #e2e8f0; }

  /* SVG Icons */
  svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  /* Utilities */
  .hidden { display: none !important; }
  .mt4 { margin-top: 16px; }
  .mt6 { margin-top: 24px; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header id="header">
    <div id="header-left">
      <h1 id="header-title">Today কাজ</h1>
    </div>
    <div class="header-right" id="header-right">
      <button class="btn-icon" id="btn-history" title="History">
        <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 16 14"/></svg>
      </button>
      <button class="btn-icon blue" id="btn-add" title="Add Job">
        <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="5" x2="13" y2="21"/><line x1="5" y1="13" x2="21" y2="13"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="main">
    <div id="view-list"></div>
    <div id="view-add" class="hidden"></div>
    <div id="view-history" class="hidden"></div>
  </main>

  <!-- SNACKBAR -->
  <div id="snackbar" class="hidden">
    <span id="snackbar-msg"></span>
    <button class="btn-undo" id="btn-undo">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
      Undo
    </button>
  </div>
</div>

<!-- OVERLAYS (portals) -->
<div id="overlay-root"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'ac_memory_jobs_v3';
const QUICK_AREAS = ['Mirpur', 'Uttara', 'Gulshan', 'Dhanmondi', 'Wari'];
const QUICK_PROBLEMS = ['Gas', 'Not cooling', 'Noise', 'Installation'];
const PRESET_AMOUNTS = [500, 1000, 1500, 2000, 3000];

let allJobs = [];
let currentView = 'list'; // list | add | history
let snackbarJob = null;

function save(jobs) { allJobs = jobs; localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs)); }

const activeJobs  = () => allJobs.filter(j => !j.completedAt);
const doneJobs    = () => allJobs.filter(j =>  j.completedAt);

function getPriority(j) {
  if (j.status === 'Payment Due') return 5;
  if (!j.targetTime) return 4;
  const d = (j.targetTime - Date.now()) / 60000;
  if (d < 0) return 1;
  if (d <= 60) return 2;
  return 3;
}

function sortedActive() {
  return [...activeJobs()].sort((a, b) => {
    const pa = getPriority(a), pb = getPriority(b);
    if (pa !== pb) return pa - pb;
    if (a.targetTime && b.targetTime) return a.targetTime - b.targetTime;
    return b.createdAt - a.createdAt;
  });
}

function fmtTime(ts) {
  const d = new Date(ts);
  const s = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', hour12: true }).format(d);
  const diff = Math.round((ts - Date.now()) / 60000);
  if (diff < 0) return { isLate: true, text: `🔴 LATE – ${s}`, secondary: '' };
  const h = Math.floor(diff / 60), m = diff % 60;
  return { isLate: false, text: s, secondary: h > 0 ? `(in ${h}h ${m}m)` : `(in ${m}m)` };
}

function calcTarget(sel, customTime) {
  const d = new Date();
  if (sel === 'Now') return d.getTime();
  if (sel === '1h')  return d.getTime() + 3600000;
  if (sel === '3h')  return d.getTime() + 10800000;
  if (sel === 'Evening') {
    d.setHours(18, 0, 0, 0);
    if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  if (sel === 'Custom' && customTime) {
    const [hh, mm] = customTime.split(':').map(Number);
    d.setHours(hh, mm, 0, 0);
    if (d.getTime() < Date.now() - 3600000) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  return d.getTime() + 3600000;
}

        <div class="empty-icon">${I.check.replace('28','72').replace('28','72')}</div>
        <h2>কোন কাজ নাই 👍</h2>
        <p>নতুন কল আসলে + চাপ দিন</p>
      </div>`;
    return;
  }

  const [top, ...rest] = jobs;
  let html = `<div class="jobs-list">
    <div><div class="section-title">🔥 Next Action</div>${jobCardHTML(top, true)}</div>`;

  }
  html += `</div>`;

  // Attach events
  el.querySelectorAll('.job-card').forEach(card => attachCardEvents(card));

    btn.addEventListener('click', e => {

}

function jobCardHTML(job, isPriority) {
  const p = getPriority(job);
  const isLate = p === 1, isUpcoming = p === 2, isPayment = p === 5;
  const isGoNow = job.status === 'Go Now';
  const timeObj = job.targetTime ? fmtTime(job.targetTime) : null;

  // ── GO NOW: special compact layout ──
  if (isGoNow) {
    return `
    <div class="card-wrapper" data-id="${job.id}">
      <div class="job-card gonow-card" data-id="${job.id}" style="border:3px solid #eab308">
        <div class="card-banner banner-gonow" style="font-size:1.1rem;padding:12px 20px">
          🟡 GO NOW
        </div>
        <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
          ${job.area
            ? `<div style="font-size:2rem;font-weight:900;color:#1e293b;display:flex;align-items:center;gap:10px">
                ${I.pin.replace('18','28').replace('18','28')} ${job.area}
               </div>`
            : `<div style="font-size:1.2rem;font-weight:700;color:#94a3b8">No area set</div>`
          }
          <a href="tel:${job.phone}" class="phone-link card-phone-link" data-phone="${job.phone}" style="margin:0">
            <div class="phone-icon">${I.phone}</div>
            <div>
              ${job.name ? `<div style="font-size:1rem;font-weight:800;color:#64748b;margin-bottom:2px">${job.name}</div>` : ''}
              <span class="phone-num">${job.phone}</span>
            </div>
          </a>
          <button class="gonow-done-btn" data-id="${job.id}" style="width:100%;background:#22c55e;color:white;border:none;border-radius:18px;padding:16px;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 4px 14px rgba(34,197,94,.4)">
            ${I.check} Done
          </button>
        </div>
      </div>
    </div>`;
  }

  // Banner
  let bannerClass, bannerText;
  if (isLate)          { bannerClass = 'banner-late';     bannerText = timeObj?.text || '🔴 LATE'; }
  else if (isPayment)  { bannerClass = 'banner-payment';  bannerText = '🔵 Payment Due'; }
  else if (isUpcoming) { bannerClass = 'banner-upcoming'; bannerText = '🟡 UPCOMING SOON'; }
  else                 { bannerClass = 'banner-callback'; bannerText = '🔴 CALL BACK'; }

  const amountBadge = (job.amount && isPayment)
    ? `<div class="banner-amount">৳${job.amount} Due</div>` : '';

  // Time
  let timeBadge = '';
  if (timeObj && !isLate && !isPayment) {
    const cls = isUpcoming ? 'upcoming' : 'normal';
    timeBadge = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
      <div class="time-badge ${cls}">${I.clock} ${timeObj.text}</div>
      ${timeObj.secondary ? `<span class="time-secondary ${cls}">${timeObj.secondary}</span>` : ''}
    </div>`;
  }

  // Meta
  const tags = [
    job.area ? `<div class="tag tag-area">${I.pin} ${job.area}</div>` : '',
    ...(job.problems || []).map(pr => `<div class="tag tag-problem">${pr}</div>`)
  ].filter(Boolean).join('');
  const meta = tags ? `<div class="card-meta">${tags}</div>` : '';
  const note = job.note ? `<div class="card-note">📝 ${job.note}</div>` : '';

  const cardClass = [
    'job-card',
    isPriority ? 'priority' : '',
    isLate ? 'late' : ''
  ].filter(Boolean).join(' ');

  return `
  <div class="card-wrapper" data-id="${job.id}">
    <div class="swipe-bg">
      <div class="swipe-done">${I.check} DONE</div>
      <div class="swipe-pay">PAYMENT ${I.bank}</div>
    </div>
    <div class="${cardClass}" data-id="${job.id}">
      <div class="card-banner ${bannerClass}">
        <div>${bannerText}</div>
        ${amountBadge}
      </div>
      <div class="card-body">
        ${timeBadge}
        <a href="tel:${job.phone}" class="phone-link card-phone-link" data-phone="${job.phone}">
          <div class="phone-icon">${I.phone}</div>
          <div>
            ${job.name ? `<div style="font-size:1rem;font-weight:800;color:#64748b;margin-bottom:2px">${job.name}</div>` : ''}
            <span class="phone-num">${job.phone}</span>
          </div>
        </a>
        ${meta}
        ${note}
      </div>
    </div>
  </div>`;
}

    const v = chip.dataset.time;

    qs('#time-chips').querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('sel-dark', c.dataset.time === selTime);

    const ct = qs('#f-custom-time');
    selTime === 'Custom' ? ct.classList.remove('hidden') : ct.classList.add('hidden');

  qs('#problem-chips').addEventListener('click', e => {
    const chip = e.target.closest('[data-problem]');
    if (!chip) return;
    const v = chip.dataset.problem;
    const idx = selProblems.indexOf(v);
    if (idx >= 0) { selProblems.splice(idx, 1); chip.classList.remove('sel-amber'); chip.textContent = `+ ${v}`; }
    else { selProblems.push(v); chip.classList.add('sel-amber'); chip.textContent = `✓ ${v}`; }

  // Area chips
  qs('#area-chips').addEventListener('click', e => {
    const chip = e.target.closest('[data-area]');
    if (!chip) return;
    const v = chip.dataset.area;

    if (selArea === v) { selArea = ''; areaInput.value = ''; chip.classList.remove('sel-blue'); }
    else {
      selArea = v; areaInput.value = v;
      qs('#area-chips').querySelectorAll('.chip').forEach(c => c.classList.remove('sel-blue'));
      chip.classList.add('sel-blue');

  // Sync area input with chips
  qs('#f-area').addEventListener('input', e => {

    qs('#area-chips').querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('sel-blue', c.dataset.area === selArea);
    });
  });

  // Paste
  qs('#btn-paste').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) { qs('#f-phone').value = text.replace(/[^0-9+]/g, ''); vib(30); }
    } catch(e) { alert('Paste failed. Please type or allow clipboard access.'); }
  });

  // Submit
  qs('#btn-save-job').addEventListener('click', () => {
    const phone = qs('#f-phone').value.trim();
    if (!phone) { qs('#f-phone').style.borderColor = '#ef4444'; qs('#f-phone').focus(); return; }

    const note = qs('#f-note').value.trim();
    const ct = qs('#f-custom-time').value;

    const newJob = {
      id: uid(), phone, name, area, problems: [...selProblems],
      note, status: 'Call Back', targetTime, createdAt: Date.now()
    };
    save([newJob, ...allJobs]);
    vib(50);
    renderListView();
    showCallPrompt(newJob);
  });

  qs('#f-phone').focus();
}

/* ── History View ── */
function renderHistoryView() {
  const el = qs('#view-history');
  const jobs = doneJobs();

  if (!jobs.length) {
    el.innerHTML = `<div class="empty-state"><p style="padding-top:80px">No completed jobs yet.</p></div>`;
    return;
  }

  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const yestStart = new Date(todayStart); yestStart.setDate(yestStart.getDate()-1);

  const groups = { '📅 Today': [], '📅 Yesterday': [], '📅 Older': [] };
  let todayAmt = 0;

  [...jobs].sort((a,b) => (b.completedAt||0) - (a.completedAt||0)).forEach(j => {
    const t = j.completedAt || 0;
    if (t >= todayStart.getTime()) { groups['📅 Today'].push(j); if (j.status==='Payment Due'&&j.amount) todayAmt += j.amount; }
    else if (t >= yestStart.getTime()) groups['📅 Yesterday'].push(j);
    else groups['📅 Older'].push(j);
  });

  let html = `<div class="history-summary">
    <span>আজকের কাজ: ${groups['📅 Today'].length}টা</span>
    ${todayAmt > 0 ? `<span class="history-amount">💰 ৳${todayAmt}</span>` : ''}
  </div>`;

  Object.entries(groups).forEach(([label, gjobs]) => {
    if (!gjobs.length) return;
    html += `<div class="history-group-label">${label}</div>`;
    gjobs.forEach(j => {
      const isPaid = j.status === 'Payment Due';
      const time = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric', hour12: true }).format(new Date(j.completedAt||0));
      html += `<div class="history-card">
        <div class="history-row">
          <div>
            <div class="history-phone">${j.phone}</div>
            ${j.name ? `<div style="font-size:.95rem;font-weight:800;color:#3b82f6">${j.name}</div>` : ''}
            ${j.area ? `<div class="history-area">${j.area}</div>` : ''}
          </div>
          <div style="text-align:right">
            <div class="status-badge ${isPaid?'status-paid':'status-done'}">${isPaid?'Paid':'Done'}</div>
            <div class="history-time">${time}</div>
          </div>
        </div>
        <button class="btn-reopen" data-id="${j.id}">${I.reopen} Back to Active</button>
      </div>`;
    });
  });

  el.innerHTML = html;

  el.querySelectorAll('.btn-reopen').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      vib(40);
      save(allJobs.map(j => j.id === id ? {...j, completedAt: undefined} : j));
      renderHistoryView();
      renderListView();
    });
  });
}

/* ── Copy Number Utility ── */
function copyNumber(phone, labelEl, btnEl) {
  const finish = (ok) => {
    if (ok) {
      labelEl.textContent = '✓ Copied!';
      btnEl.style.background = '#dcfce7';
      btnEl.style.borderColor = '#86efac';
      btnEl.style.color = '#166534';
    } else {
      // Both APIs failed — show number in a selectable input inside the overlay
      const box = document.createElement('input');
      box.value = phone;
      box.readOnly = true;
      box.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:200;background:#1e293b;color:#fff;border:2px solid #3b82f6;border-radius:12px;padding:12px 20px;font-size:1.3rem;font-weight:900;text-align:center;width:260px;letter-spacing:2px';
      document.body.appendChild(box);
      box.focus(); box.select();
      setTimeout(() => box.remove(), 4000);
      labelEl.textContent = 'See below ↓';
    }
  };

  // Try modern clipboard API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(phone).then(() => finish(true)).catch(() => tryExecCommand());
  } else {
    tryExecCommand();
  }

  function tryExecCommand() {
    try {
      const ta = document.createElement('textarea');
      ta.value = phone;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      finish(ok);
    } catch(e) { finish(false); }
  }
}

/* ── Payment Sheet ── */
function showPaymentSheet(jobId) {
  const job = allJobs.find(j => j.id === jobId);
  if (!job) return;
  vib(30);

  overlayRoot.innerHTML = `
  <div class="overlay-sheet" id="pay-overlay">
    <div class="sheet-box">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">${I.bank.replace('28','32')} Enter Due Amount</div>
        <button class="btn-close" id="pay-close">${I.x.replace('28','28')}</button>
      </div>
      <div class="preset-grid">
        ${PRESET_AMOUNTS.map(a => `<button class="preset-btn" data-amt="${a}">৳${a}</button>`).join('')}
      </div>
      <div class="amount-row">
        <span class="taka-sign">৳</span>
        <input id="payment-input" type="number" placeholder="Custom Amount" inputmode="numeric" />
      </div>
      <button class="btn-save-pay" id="pay-save" disabled>Save Payment Due</button>
    </div>
  </div>`;

  const input = qs('#payment-input');
  const saveBtn = qs('#pay-save');

  qs('#pay-close').addEventListener('click', clearOverlay);
  qs('#pay-overlay').addEventListener('click', e => { if (e.target.id==='pay-overlay') clearOverlay(); });

  overlayRoot.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => { input.value = btn.dataset.amt; saveBtn.disabled = false; vib(20); });
  });

  input.addEventListener('input', () => { saveBtn.disabled = !input.value; });
  input.focus();

  saveBtn.addEventListener('click', () => {
    const amt = Number(input.value);
    if (!amt) return;
    save(allJobs.map(j => j.id === jobId ? {...j, status:'Payment Due', amount:amt} : j));
    vib(50); clearOverlay(); renderListView();
  });
}

/* ── Action Sheet ── */
function showActionSheet(job) {
  const isPayment = job.status === 'Payment Due';

  overlayRoot.innerHTML = `
  <div class="overlay-sheet" id="action-overlay">
    <div class="sheet-box">
      <div class="sheet-handle"></div>
      ${job.name ? `<div style="font-size:1.1rem;font-weight:800;color:#64748b;text-align:center;margin-bottom:4px">${job.name}</div>` : ''}
      <div class="action-sheet-phone">${job.phone}</div>
      <div style="display:flex;gap:10px">
        <a href="tel:${job.phone}" class="action-btn action-call" id="act-call" style="flex:1">
          ${I.phone.replace('28','28')} Call Customer
        </a>
        <button id="act-copy" title="Copy number" style="background:#f1f5f9;border:2px solid #e2e8f0;border-radius:16px;padding:0 18px;cursor:pointer;font-weight:900;font-size:.85rem;color:#475569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;transition:background .15s">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="act-copy-label">Copy</span>
        </button>
      </div>
      ${!isPayment ? `
      <button class="action-btn action-gonow" id="act-gonow">${I.nav.replace('28','28')} Mark 'Go Now'</button>
      <button class="action-btn action-payment-due" id="act-paydue">${I.bank.replace('28','28')} Mark 'Payment Due'</button>
      ` : ''}
      <button class="action-btn action-done" id="act-done">
        ${isPayment ? `${I.bank.replace('28','36')} Paid` : `${I.check.replace('28','36')} Done`}
      </button>
    </div>
  </div>`;

  qs('#action-overlay').addEventListener('click', e => { if(e.target.id==='action-overlay') clearOverlay(); });

  // Call button — let href fire first, then clean up overlay after
  qs('#act-call').addEventListener('click', () => {
    setTimeout(clearOverlay, 300);
  });

  // Copy number button
  qs('#act-copy').addEventListener('click', () => {
    copyNumber(job.phone, qs('#act-copy-label'), qs('#act-copy'));
  });

  if (!isPayment) {
    qs('#act-gonow').addEventListener('click', () => {
      save(allJobs.map(j => j.id===job.id ? {...j, status:'Go Now'} : j));
      vib(30); clearOverlay(); renderListView();
    });
    qs('#act-paydue').addEventListener('click', () => { clearOverlay(); showPaymentSheet(job.id); });
  }

  qs('#act-done').addEventListener('click', () => { clearOverlay(); triggerDone(job.id, isPayment); });
}

/* ── Done Animation ── */
function showDoneAnim(isPaid) {
  overlayRoot.innerHTML = isPaid
    ? `<div class="anim-overlay"><div class="anim-paid"><div class="anim-paid-emoji">💰</div><div class="anim-paid-text">PAID!</div></div></div>`
    : `<div class="anim-overlay"><div class="anim-done-circle"><svg width="90" height="90" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="45" cy="45" r="42"/><path d="m27 45 12 12 24-24"/></svg></div></div>`;
  setTimeout(clearOverlay, isPaid ? 1500 : 1200);
}

/* ═══════════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════════ */
function triggerDone(id, isPaid = false) {
  vib([50, 100, 50]);
  showDoneAnim(isPaid);
  setTimeout(() => {
    save(allJobs.map(j => j.id===id ? {...j, completedAt: Date.now()} : j));
    renderListView();
    showSnackbar(id, isPaid ? '✅ Paid' : '✅ Done');
  }, 400);
}

/* ─ Snackbar ─ */
function showSnackbar(id, msg) {
  snackbarJob = id;
  const sb = qs('#snackbar');
  qs('#snackbar-msg').textContent = msg;
  qs('#btn-undo').style.display = id ? '' : 'none';
  sb.classList.remove('hidden');
  if (snackbarTimer) clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(() => { sb.classList.add('hidden'); snackbarJob = null; }, 4000);
}

qs('#btn-undo').addEventListener('click', () => {
  if (!snackbarJob) return;
  vib(40);
  save(allJobs.map(j => j.id===snackbarJob ? {...j, completedAt: undefined} : j));
  qs('#snackbar').classList.add('hidden');
  snackbarJob = null;
  if (snackbarTimer) clearTimeout(snackbarTimer);
  renderListView();
});

/* ═══════════════════════════════════════════════════════════
   CARD SWIPE / LONG PRESS
═══════════════════════════════════════════════════════════ */
function attachCardEvents(cardEl) {
  let startX = 0, startY = 0, isDragging = false;
  let lpTimer = null;
  const id = cardEl.dataset.id;

  const getJob = () => allJobs.find(j => j.id === id);

  const clearLP = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };

  cardEl.addEventListener('touchstart', e => {
    // If tapping the phone link, let it navigate — don't start LP or swipe tracking
    if (e.target.closest('.card-phone-link')) { return; }
    const touch = e.touches[0];
    startX = touch.clientX; startY = touch.clientY;
    isDragging = false;
    clearLP();
    lpTimer = setTimeout(() => {
      vib([50,50,50]);
      const j = getJob();
      if (j) triggerDone(j.id, j.status === 'Payment Due');
    }, 600);
  }, { passive: true });

  cardEl.addEventListener('touchmove', e => {
    if (e.target.closest('.card-phone-link')) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { clearLP(); isDragging = true; }
    if (Math.abs(dx) > 10) {
      e.preventDefault();
      cardEl.style.transform = `translateX(${dx * 0.8}px)`;
    }
  }, { passive: false });

  cardEl.addEventListener('touchend', e => {
    // Phone link tap — let browser handle tel: navigation, don't open action sheet
    if (e.target.closest('.card-phone-link')) { cardEl.style.transform = ''; return; }
    clearLP();
    const dx = e.changedTouches[0].clientX - startX;
    cardEl.style.transform = '';
    if (Math.abs(dx) > 90) {
      const j = getJob();
      if (!j) return;
      if (dx > 0) { triggerDone(j.id, j.status==='Payment Due'); }
      else { if (j.status !== 'Payment Due') showPaymentSheet(j.id); }
    } else if (!isDragging && Math.abs(dx) < 10) {
      const j = getJob();
      if (j) showActionSheet(j);
    }
  });

  // Mouse fallback (desktop)
  let mouseDown = false, mouseX = 0;
  cardEl.addEventListener('mousedown', e => {
    if (e.target.closest('a') || e.target.closest('button')) return;
    mouseDown = true; mouseX = e.clientX;
    clearLP();
    lpTimer = setTimeout(() => {
      const j = getJob();
      if (j) triggerDone(j.id, j.status==='Payment Due');
    }, 600);
  });
  document.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    if (Math.abs(e.clientX - mouseX) > 10) clearLP();
  });
  document.addEventListener('mouseup', e => {
    if (!mouseDown) return; mouseDown = false; clearLP();
    const dx = e.clientX - mouseX;
    if (Math.abs(dx) > 90) {
      const j = getJob();
      if (!j) return;
      if (dx > 0) triggerDone(j.id, j.status==='Payment Due');
      else if (j.status !== 'Payment Due') showPaymentSheet(j.id);
    } else if (Math.abs(dx) < 10 && !e.target.closest('a') && !e.target.closest('button')) {
      const j = getJob(); if (j) showActionSheet(j);
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
setView('list');
renderListView();

// Re-tick every 15s to update time badges
setInterval(() => { if (currentView === 'list') renderListView(); }, 15000);
</script>
